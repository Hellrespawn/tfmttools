[workspace.package]
version = "0.24.0"
authors = ["Stef Korporaal <stef@skorporaal.com>"]
description = "Rename audio files according to their tags using path templates."
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.91.0"
repository = "https://github.com/Hellrespawn/tfmttools"
homepage = "https://github.com/Hellrespawn/tfmttools"


[workspace]
members = [
    "crates/core",
    "crates/fs",
    "crates/picotmpl",
    "crates/test-cli",
    "crates/test-harness",
    "crates/tfmt",
    "xtask",
]
default-members = ["crates/tfmt"]
resolver = "3"

[workspace.dependencies]
tfmttools-picotmpl = { path = "crates/picotmpl" }
adler2 = "2.0.1"
assert_cmd = "2.2.1"
assert_fs = "1.1.3"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.3"
clap_mangen = "0.3.0"
color-eyre = "0.6.5"
console = "0.16.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
fastrand = "2.4.1"
fs-err = "3.3.0"
ignore = "0.4.25"
indexmap = { version = "2.14.0", features = ["serde"] }
indicatif = { version = "0.18.4", features = ["improved_unicode"] }
itertools = "0.15.0"
libtest-mimic = "0.8.2"
lofty = "0.25.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rusqlite_migration = "=2.3.0"
regex = "1.12.3"
schemars = { version = "1.0", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tempfile = "3.27.0"
textwrap = "0.16.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true    # Automatically strip symbols from the binary.
lto = true
opt-level = "z" # Optimize for size.

# Shared Clippy policy; every member opts in with [lints] workspace = true.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
